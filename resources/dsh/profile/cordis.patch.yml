# RealmFlow immutable ACP profile overlay. Stdout is reserved for ACP frames.
# Keep this layer limited to rows already supplied by the selected DSH bundles.

- id: acp
  config:
    provider: !!js process.env.REALMFLOW_DSH_PROVIDER_ID
    model: !!js process.env.REALMFLOW_DSH_MODEL_ID

- id: agent-default-model
  config:
    provider: !!js process.env.REALMFLOW_DSH_PROVIDER_ID
    model: !!js process.env.REALMFLOW_DSH_MODEL_ID

- id: session-persistence-jsonl
  config:
    root: !!js process.env.REALMFLOW_DSH_SESSION_ROOT
    compression: zstd

- id: tools
  config:
    presentation: native

- id: subagent
  config:
    maxActiveSubagents: 4

- id: hmr
  disabled: true

- id: plugin-manager
  disabled: true

- id: tool-plugin-manager
  disabled: true

- id: config-editor
  disabled: true

- id: settings
  disabled: true

- id: authorization
  disabled: true

- id: deepseek-account
  disabled: true

- id: llm-deepseek-account
  disabled: true

- id: llm-pi-ai
  disabled: false
  config:
    providers: !!js JSON.parse(process.env.REALMFLOW_DSH_PI_AI_PROVIDERS ?? '{}')

- id: web-search-deepseek
  disabled: true

- id: web
  disabled: true

- id: web-fetch-http
  disabled: true

- id: tool-web
  disabled: true

- id: workflow-ptc
  disabled: true

- id: tool-workflow
  disabled: true

- id: session-log-deepseek
  disabled: true
  config:
    enabled: false

- id: session-telemetry-otel
  disabled: true

- id: otel
  disabled: true
